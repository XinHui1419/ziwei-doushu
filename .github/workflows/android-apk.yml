name: Android APK

# 打包 Android 安装包（调试版，可直接装到手机上）。
# 跑完后在本次运行页面底部「Artifacts」下载 ziwei-android-apk，解压得到 app-debug.apk。
# 说明见 docs/mobile-app.md
# 推送任何分支都会打包（「Run workflow」按钮只对默认分支上的工作流出现，fork 后不一定方便合并到 main）
on:
  push:
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'capacitor.config.ts'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    name: 打包 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 需要 JDK 21；Android SDK 在 GitHub 的 ubuntu 机器上已预装
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 静态导出网页并同步到 Android 工程
        run: npm run mobile:build

      - name: 编译 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
